<!DOCTYPE html>
<html>

<head>
  <title>Admin Panel</title>

  <style>
    body {
      background: #0f0f0f;
      color: white;
      font-family: Arial;
      padding: 20px;
    }

    input,
    textarea {
      width: 100%;
      padding: 10px;
      margin-bottom: 10px;
      background: #111;
      color: white;
      border: 1px solid gold;
      border-radius: 8px;
      box-sizing: border-box;
    }

    button {
      background: gold;
      border: none;
      padding: 10px 15px;
      border-radius: 20px;
      cursor: pointer;
      font-weight: bold;
    }

    img {
      max-width: 100%;
    }
  </style>
</head>

<body>

  <h2>Admin Panel</h2>

  <input id="name" placeholder="Product Name">

  <input id="category" placeholder="Category">

  <input id="subcategory" placeholder="Subcategory">

  <textarea
    id="description"
    placeholder="Description"
  ></textarea>
  
  
  <textarea
  id="pricing"
  placeholder="Pricing tiers...
1-10 pcs = $10
11-100 pcs = $8
101-1000 pcs = $6"
></textarea>
  


  <input type="file" id="image">

  <!-- IMPORTANT -->
  <button id="saveBtn">
    Add Product
  </button>

  <hr>

<input
  id="searchInput"
  placeholder="Search products..."




  <h3>Products</h3>

  <div id="adminList"></div>

  <script type="module" src="admin.js"></script>

</body>
</html>
